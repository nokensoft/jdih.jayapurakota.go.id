<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prasyarat Penggunaan — JDIH Kota Jayapura</title>
  <link rel="icon" type="image/png" href="assets/kotajayapura-logo.png">
  <link rel="apple-touch-icon" href="assets/kotajayapura-logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="assets/js/data-dokumen.js"></script>
  <script src="assets/js/store.js"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="font-sans bg-slate-50 text-slate-700 antialiased">

  <div id="site-header"></div>

  <section class="bg-gradient-to-br from-navy-700 via-navy-800 to-navy-950 text-white">
    <div class="max-w-6xl mx-auto px-4 py-10 text-center">
      <nav class="text-sm text-white/70">
        <a href="index.html" class="hover:text-white">Beranda</a><span class="mx-2">/</span><span class="text-white">Prasyarat Penggunaan</span>
      </nav>
      <h1 class="mt-3 text-3xl sm:text-4xl font-black tracking-tight">Prasyarat Penggunaan</h1>
      <p class="mt-2 text-sm text-white/70">Terakhir diperbarui: 26 November 2026</p>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 py-12 grid lg:grid-cols-4 gap-8" x-data="termsPage()">
    <!-- Daftar isi -->
    <aside class="hidden lg:block">
      <div class="bg-white rounded-lg shadow-sm p-5 sticky top-20">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Daftar Isi</p>
        <ol class="mt-3 space-y-2 text-sm">
          <template x-for="(s, i) in sections" :key="i">
            <li><a :href="'#p' + (i+1)" class="hover:text-navy-700" x-text="(i+1) + '. ' + s.title"></a></li>
          </template>
        </ol>
      </div>
    </aside>

    <article class="lg:col-span-3 space-y-6">
      <div class="bg-brand-50 text-navy-800 text-sm rounded-lg px-5 py-4">
        <i class="fa-solid fa-circle-info mr-1.5"></i>
        Dengan mengakses dan menggunakan situs JDIH Kota Jayapura, Anda dianggap telah membaca, memahami, dan menyetujui
        prasyarat penggunaan berikut.
      </div>

      <template x-for="(s, i) in sections" :key="i">
        <section :id="'p' + (i+1)" class="bg-white rounded-lg shadow-sm p-6 sm:p-8 scroll-mt-20">
          <h2 class="text-xl font-extrabold text-navy-800" x-text="(i+1) + '. ' + s.title"></h2>
          <ul class="mt-4 space-y-2.5">
            <template x-for="(p, j) in s.points" :key="j">
              <li class="flex gap-3 leading-relaxed"><span class="text-orange-500 mt-0.5"><i class="fa-solid fa-check"></i></span><span x-text="p"></span></li>
            </template>
          </ul>
        </section>
      </template>

      <!-- Simulasi persetujuan -->
      <section class="bg-white rounded-lg shadow-sm p-6 sm:p-8">
        <template x-if="!agreedAt">
          <div class="flex flex-wrap items-center gap-4">
            <label class="flex items-center gap-3 flex-1 min-w-[16rem] cursor-pointer">
              <input type="checkbox" x-model="check" class="w-5 h-5 accent-navy-700">
              <span>Saya telah membaca dan menyetujui Prasyarat Penggunaan ini.</span>
            </label>
            <button @click="agree()" :disabled="!check"
                    class="bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white font-bold px-6 py-2.5 rounded">Setuju</button>
          </div>
        </template>
        <template x-if="agreedAt">
          <div class="flex flex-wrap items-center gap-4">
            <p class="flex-1 text-emerald-700"><i class="fa-solid fa-circle-check mr-1.5"></i>Anda menyetujui prasyarat ini pada <b x-text="agreedAt"></b>.</p>
            <button @click="revoke()" class="text-sm font-bold text-slate-500 hover:text-red-600">Batalkan persetujuan</button>
          </div>
        </template>
      </section>
    </article>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/layout.js"></script>

  <script>
    function termsPage() {
      const KEY = 'jdih_terms_agreed';
      let saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      return {
        check: false,
        agreedAt: saved,
        agree() {
          this.agreedAt = new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
          try { localStorage.setItem(KEY, this.agreedAt); } catch (e) {}
          window.dispatchEvent(new CustomEvent('toast', { detail: 'Terima kasih, persetujuan Anda tercatat (simulasi).' }));
        },
        revoke() {
          this.agreedAt = null; this.check = false;
          try { localStorage.removeItem(KEY); } catch (e) {}
        },
        sections: [
          { title: 'Ketentuan Umum', points: [
            'Situs JDIH Kota Jayapura dikelola oleh Pemerintah Kota Jayapura sebagai sarana penyebarluasan informasi hukum kepada masyarakat.',
            'Layanan ini dapat diakses tanpa biaya dan tanpa pendaftaran bagi pengunjung umum.',
            'Akses ke panel pengelola hanya diperuntukkan bagi petugas yang diberi kewenangan.' ] },
          { title: 'Status Dokumen', points: [
            'Dokumen yang tersedia merupakan salinan elektronik dan disediakan untuk keperluan informasi.',
            'Apabila terdapat perbedaan, naskah yang berlaku adalah naskah asli yang diundangkan dalam Lembaran Daerah atau Berita Daerah Kota Jayapura.',
            'Status dokumen (Berlaku, Diubah, Dicabut) diperbarui secara berkala; pengguna disarankan memeriksa kembali ke instansi terkait untuk keperluan resmi.' ] },
          { title: 'Penggunaan yang Diperbolehkan', points: [
            'Mengunduh, mencetak, dan mengutip dokumen untuk keperluan pribadi, pendidikan, penelitian, maupun kedinasan dengan menyebutkan sumber.',
            'Membagikan tautan halaman dokumen kepada pihak lain.' ] },
          { title: 'Larangan', points: [
            'Mengubah isi dokumen lalu menyebarkannya seolah-olah sebagai dokumen resmi.',
            'Melakukan akses otomatis berlebihan (scraping massal) yang dapat mengganggu ketersediaan layanan.',
            'Mencoba mengakses panel pengelola atau sistem tanpa hak.' ] },
          { title: 'Batasan Tanggung Jawab', points: [
            'Pengelola berupaya menjaga keakuratan dan ketersediaan informasi, namun tidak menjamin situs bebas dari kesalahan atau gangguan.',
            'Pengelola tidak bertanggung jawab atas kerugian yang timbul akibat penggunaan informasi tanpa merujuk pada naskah resmi.' ] },
          { title: 'Perubahan Prasyarat', points: [
            'Prasyarat ini dapat diperbarui sewaktu-waktu. Tanggal pembaruan terakhir tercantum di bagian atas halaman.' ] },
        ],
      };
    }
  </script>
</body>
</html>
