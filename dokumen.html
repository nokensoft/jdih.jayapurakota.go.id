<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen Hukum — JDIH Kota Jayapura</title>
  <meta name="description" content="Daftar dokumen hukum Pemerintah Kota Jayapura">
  <link rel="icon" type="image/png" href="assets/kotajayapura-logo.png">
  <link rel="apple-touch-icon" href="assets/kotajayapura-logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="assets/js/data-dokumen.js"></script>
  <script src="assets/js/store.js"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="font-sans bg-slate-50 text-slate-700 antialiased">

  <div id="site-header"></div>

  <div x-data="docsPage()">
    <!-- Judul halaman -->
    <section class="bg-gradient-to-br from-navy-700 via-navy-800 to-navy-950 text-white">
      <div class="max-w-6xl mx-auto px-4 py-10 text-center">
        <nav class="text-sm text-white/70">
          <a href="index.html" class="hover:text-white">Beranda</a>
          <span class="mx-2">/</span>
          <span class="text-white" x-text="categoryName || 'Semua Dokumen'"></span>
        </nav>
        <h1 class="mt-3 text-3xl sm:text-4xl font-black tracking-tight" x-text="categoryName || 'Semua Dokumen Hukum'"></h1>

        <form @submit.prevent class="mt-6 max-w-3xl mx-auto flex rounded-md overflow-hidden shadow-lg">
          <input x-model.debounce.250ms="query" type="search" placeholder="Cari nomor, tahun, atau judul peraturan..."
                 class="flex-1 min-w-0 px-5 py-3 text-slate-700 border-0 focus:outline-none focus:ring-0">
          <button type="submit" class="bg-orange-500 hover:bg-orange-600 px-5 sm:px-8 font-bold text-white whitespace-nowrap">
            <i class="fa-solid fa-magnifying-glass sm:hidden"></i><span class="hidden sm:inline">Cari Dokumen</span>
          </button>
        </form>
      </div>
    </section>

    <main class="max-w-6xl mx-auto px-4 py-10 grid lg:grid-cols-3 gap-8">

      <!-- Daftar -->
      <section class="lg:col-span-2">
        <div class="flex flex-wrap items-center gap-3 bg-white rounded-lg shadow-sm p-4">
          <select x-model="year" class="border border-slate-200 rounded px-3 py-2 text-sm bg-white">
            <option value="">Semua Tahun</option>
            <template x-for="y in years" :key="y"><option :value="y" x-text="y"></option></template>
          </select>
          <select x-model="status" class="border border-slate-200 rounded px-3 py-2 text-sm bg-white">
            <option value="">Semua Status</option>
            <template x-for="s in JDIH.STATUSES" :key="s"><option :value="s" x-text="s"></option></template>
          </select>
          <select x-model="sort" class="border border-slate-200 rounded px-3 py-2 text-sm bg-white">
            <option value="new">Terbaru</option>
            <option value="old">Terlama</option>
            <option value="pop">Paling banyak diunduh</option>
          </select>
          <p class="ml-auto text-sm text-slate-500"><span class="font-bold text-slate-700" x-text="filtered.length"></span> dokumen</p>
          <button x-show="query || year || status || category" x-cloak @click="resetFilters()"
                  class="text-sm font-semibold text-navy-700 hover:underline">
            <i class="fa-solid fa-xmark mr-1"></i>Reset
          </button>
        </div>

        <div class="mt-6 space-y-5">
          <template x-for="d in paged" :key="d.id">
            <article class="bg-white rounded-lg shadow-sm border-l-4 border-orange-400 p-6">
              <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-slate-500">
                <span class="px-2 py-0.5 rounded bg-brand-50 text-navy-700 text-xs font-extrabold" x-text="d.type"></span>
                <span x-show="d.contoh" class="px-2 py-0.5 rounded bg-amber-50 text-amber-700 text-xs font-bold" title="Dokumen contoh untuk simulasi">Contoh</span>
                <span><i class="fa-regular fa-calendar text-brand-600 mr-1.5"></i><span x-text="JDIH.formatDate(d.date)"></span></span>
                <span><i class="fa-solid fa-download text-slate-400 mr-1.5"></i><span x-text="JDIH.formatNumber(d.downloads)"></span> kali diunduh</span>
                <span class="text-xs font-bold px-2 py-0.5 rounded-full" :class="statusClass(d.status)" x-text="d.status"></span>
              </div>
              <h3 class="mt-3 text-lg font-extrabold text-slate-900">
                <a :href="'detail.html?id=' + d.id" class="hover:text-navy-700" x-text="d.title"></a>
              </h3>
              <p class="mt-2 text-slate-600" x-text="d.desc"></p>
              <div class="mt-4 flex flex-wrap gap-2">
                <button @click="d.downloads = JDIH.download(d.id)" class="bg-navy-800 hover:bg-navy-900 text-white text-sm px-4 py-2 rounded">Unduh PDF</button>
                <a :href="'detail.html?id=' + d.id" class="border border-slate-200 hover:border-navy-700 hover:text-navy-700 text-sm px-4 py-2 rounded">Detail</a>
              </div>
            </article>
          </template>

          <div x-show="filtered.length===0" x-cloak class="bg-white rounded-lg shadow-sm p-12 text-center text-slate-500">
            <i class="fa-solid fa-folder-open text-3xl text-slate-300"></i>
            <p class="mt-3">Dokumen tidak ditemukan.</p>
          </div>
        </div>

        <!-- Paginasi -->
        <div x-show="pages > 1" x-cloak class="mt-8 flex flex-wrap items-center justify-center gap-2">
          <button @click="go(page-1)" :disabled="page===1"
                  class="w-10 h-10 rounded bg-white shadow-sm disabled:opacity-40"><i class="fa-solid fa-chevron-left"></i></button>
          <template x-for="n in pages" :key="n">
            <button @click="go(n)" class="w-10 h-10 rounded font-bold shadow-sm"
                    :class="n===page ? 'bg-navy-700 text-white' : 'bg-white hover:text-navy-700'" x-text="n"></button>
          </template>
          <button @click="go(page+1)" :disabled="page===pages"
                  class="w-10 h-10 rounded bg-white shadow-sm disabled:opacity-40"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </section>

      <!-- Sidebar -->
      <aside>
        <div class="bg-white rounded-lg shadow-sm p-6 lg:sticky lg:top-20">
          <h3 class="text-xl font-extrabold text-navy-800 pb-3 border-b border-slate-200">Kategori Hukum</h3>
          <ul class="mt-2 divide-y divide-slate-100">
            <li>
              <a href="dokumen.html" class="flex items-center justify-between py-3 hover:text-navy-700"
                 :class="!category && 'text-navy-700 font-bold'">
                <span>Semua Dokumen</span>
                <span class="min-w-[2.25rem] text-center text-xs font-extrabold px-2 py-1 rounded-full bg-brand-50 text-navy-800" x-text="docs.length"></span>
              </a>
            </li>
            <template x-for="c in categories" :key="c.code">
              <li>
                <a :href="'dokumen.html?kategori=' + c.code" class="flex items-center justify-between py-3 hover:text-navy-700"
                   :class="category===c.code && 'text-navy-700 font-bold'">
                  <span x-text="c.name"></span>
                  <span class="min-w-[2.25rem] text-center text-xs font-extrabold px-2 py-1 rounded-full bg-brand-50 text-navy-800" x-text="c.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/layout.js"></script>

  <script>
    function docsPage() {
      const db = JDIH.load();
      const PER_PAGE = 6;
      return {
        docs: db.docs,
        categories: db.categories.map((c) => ({ ...c, count: db.docs.filter((d) => d.type === c.code).length })),
        category: JDIH.param('kategori') || '',
        query: JDIH.param('q') || '',
        year: JDIH.param('tahun') || '',
        status: '',
        sort: 'new',
        page: 1,

        init() {
          // Kembali ke halaman 1 setiap filter berubah
          ['query', 'year', 'status', 'sort'].forEach((k) => this.$watch(k, () => { this.page = 1; }));
        },
        get categoryName() { return (this.categories.find((c) => c.code === this.category) || {}).name || ''; },
        get years() { return [...new Set(this.docs.map((d) => d.year))].sort((a, b) => b - a); },
        get filtered() {
          const q = this.query.toLowerCase().trim();
          const list = this.docs.filter((d) =>
            (!this.category || d.type === this.category) &&
            (!this.year || String(d.year) === String(this.year)) &&
            (!this.status || d.status === this.status) &&
            (!q || [d.title, d.desc, d.number, d.year, d.subject].join(' ').toLowerCase().includes(q))
          );
          if (this.sort === 'pop') return list.sort((a, b) => b.downloads - a.downloads);
          list.sort(JDIH.byDateDesc);
          return this.sort === 'old' ? list.reverse() : list;
        },
        get pages() { return Math.max(1, Math.ceil(this.filtered.length / PER_PAGE)); },
        get paged() { return this.filtered.slice((this.page - 1) * PER_PAGE, this.page * PER_PAGE); },
        go(n) { if (n >= 1 && n <= this.pages) { this.page = n; window.scrollTo({ top: 0, behavior: 'smooth' }); } },
        resetFilters() {
          if (this.category) { location.href = 'dokumen.html'; return; }
          this.query = ''; this.year = ''; this.status = '';
        },
        statusClass(s) {
          return { Berlaku: 'bg-emerald-50 text-emerald-700', Diubah: 'bg-amber-50 text-amber-700', Dicabut: 'bg-red-50 text-red-700' }[s] || 'bg-slate-100';
        },
      };
    }
  </script>
</body>
</html>
