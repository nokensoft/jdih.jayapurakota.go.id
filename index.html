<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDIH Kota Jayapura</title>
  <meta name="description" content="Jaringan Dokumentasi dan Informasi Hukum Pemerintah Kota Jayapura. Cari dan unduh Peraturan Daerah, Peraturan Walikota, Keputusan Walikota, Surat Edaran, dan Monografi Hukum.">
  <link rel="canonical" href="https://jdih.jayapurakota.go.id/">
  <!-- Open Graph / Twitter Card (pratinjau saat tautan dibagikan) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JDIH Kota Jayapura">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="JDIH Kota Jayapura">
  <meta property="og:description" content="Jaringan Dokumentasi dan Informasi Hukum Pemerintah Kota Jayapura. Cari dan unduh Peraturan Daerah, Peraturan Walikota, Keputusan Walikota, Surat Edaran, dan Monografi Hukum.">
  <meta property="og:url" content="https://jdih.jayapurakota.go.id/">
  <meta property="og:image" content="https://jdih.jayapurakota.go.id/assets/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Kota Jayapura dan tampilan beranda JDIH Kota Jayapura">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JDIH Kota Jayapura">
  <meta name="twitter:description" content="Jaringan Dokumentasi dan Informasi Hukum Pemerintah Kota Jayapura. Cari dan unduh Peraturan Daerah, Peraturan Walikota, Keputusan Walikota, Surat Edaran, dan Monografi Hukum.">
  <meta name="twitter:image" content="https://jdih.jayapurakota.go.id/assets/og-image.jpg">
  <link rel="icon" type="image/png" href="assets/kotajayapura-logo.png">
  <link rel="apple-touch-icon" href="assets/kotajayapura-logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="assets/js/data-dokumen.js"></script>
  <script src="assets/js/store.js"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="font-sans bg-slate-50 text-slate-700 antialiased">

  <div id="site-header"></div>

  <div x-data="homePage()">
    <!-- ================= HERO + PENCARIAN ================= -->
    <section class="bg-gradient-to-br from-navy-700 via-navy-800 to-navy-950 text-white">
      <div class="max-w-4xl mx-auto px-4 py-16 lg:py-20 text-center">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tight">Pusat Dokumentasi Hukum Terpadu</h1>

        <form action="dokumen.html" method="get" class="mt-10 max-w-3xl mx-auto flex rounded-md overflow-hidden shadow-lg">
          <input name="q" type="search" placeholder="Cari nomor, tahun, atau judul peraturan..."
                 class="flex-1 min-w-0 px-5 py-3.5 text-slate-700 border-0 focus:outline-none focus:ring-0">
          <button type="submit" class="bg-orange-500 hover:bg-orange-600 px-5 sm:px-8 font-bold text-white whitespace-nowrap">
            <i class="fa-solid fa-magnifying-glass sm:hidden"></i><span class="hidden sm:inline">Cari Dokumen</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ================= KONTEN ================= -->
    <main class="max-w-6xl mx-auto px-4 py-12 grid lg:grid-cols-3 gap-8">

      <div class="lg:col-span-2 space-y-12">
        <!-- Statistik -->
        <section>
          <h2 class="inline-block text-2xl font-extrabold text-navy-800 pb-3 border-b-2 border-navy-800">Statistik Dokumen Hukum</h2>
          <div class="mt-6 grid sm:grid-cols-3 gap-5">
            <template x-for="s in stats" :key="s.label">
              <a :href="s.href" class="block bg-white rounded-lg shadow-sm border-l-4 border-navy-800 py-7 text-center hover:shadow-md transition-shadow">
                <p class="text-4xl font-extrabold text-navy-800" x-text="JDIH.formatNumber(s.value)"></p>
                <p class="mt-2 text-sm tracking-[0.15em] uppercase text-slate-500" x-text="s.label"></p>
              </a>
            </template>
          </div>
        </section>

        <!-- Dokumen terbaru -->
        <section>
          <div class="flex items-end justify-between gap-4">
            <h2 class="inline-block text-2xl font-extrabold text-navy-800 pb-3 border-b-2 border-navy-800">Dokumen Terbaru</h2>
            <a href="dokumen.html" class="text-sm font-bold text-navy-700 hover:underline pb-3 whitespace-nowrap">
              Lihat semua <i class="fa-solid fa-arrow-right ml-1"></i>
            </a>
          </div>

          <div class="mt-6 space-y-5">
            <template x-for="d in latest" :key="d.id">
              <article class="bg-white rounded-lg shadow-sm border-l-4 border-orange-400 p-6">
                <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-slate-500">
                  <span class="px-2 py-0.5 rounded bg-brand-50 text-navy-700 text-xs font-extrabold" x-text="d.type"></span>
                  <span x-show="d.contoh" class="px-2 py-0.5 rounded bg-amber-50 text-amber-700 text-xs font-bold" title="Dokumen contoh untuk simulasi">Contoh</span>
                  <span><i class="fa-regular fa-calendar text-brand-600 mr-1.5"></i><span x-text="JDIH.formatDate(d.date)"></span></span>
                  <span><i class="fa-solid fa-download text-slate-400 mr-1.5"></i><span x-text="JDIH.formatNumber(d.downloads)"></span> kali diunduh</span>
                </div>
                <h3 class="mt-3 text-lg font-extrabold text-slate-900">
                  <a :href="'detail.html?id=' + d.id" class="hover:text-navy-700" x-text="d.title"></a>
                </h3>
                <p class="mt-2 text-slate-600" x-text="d.desc"></p>
                <div class="mt-4 flex flex-wrap gap-2">
                  <button @click="d.downloads = JDIH.download(d.id)" class="bg-navy-800 hover:bg-navy-900 text-white text-sm px-4 py-2 rounded">Unduh PDF</button>
                  <a :href="'detail.html?id=' + d.id" class="border border-slate-200 hover:border-navy-700 hover:text-navy-700 text-sm px-4 py-2 rounded">Detail</a>
                </div>
              </article>
            </template>
          </div>
        </section>
      </div>

      <!-- Sidebar -->
      <aside>
        <div class="bg-white rounded-lg shadow-sm p-6 lg:sticky lg:top-20">
          <h3 class="text-xl font-extrabold text-navy-800 pb-3 border-b border-slate-200">Kategori Hukum</h3>
          <ul class="mt-2 divide-y divide-slate-100">
            <template x-for="c in categories" :key="c.code">
              <li>
                <a :href="'dokumen.html?kategori=' + c.code" class="flex items-center justify-between py-3 hover:text-navy-700">
                  <span x-text="c.name"></span>
                  <span class="min-w-[2.25rem] text-center text-xs font-extrabold px-2 py-1 rounded-full bg-brand-50 text-navy-800" x-text="c.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/layout.js"></script>

  <script>
    function homePage() {
      const db = JDIH.load();
      const count = (code) => db.docs.filter((d) => d.type === code).length;
      return {
        stats: [
          { label: 'Peraturan Daerah',   value: count('PERDA'),   href: 'dokumen.html?kategori=PERDA' },
          { label: 'Peraturan Walikota', value: count('PERWALI'), href: 'dokumen.html?kategori=PERWALI' },
          { label: 'Total Dokumen',      value: db.docs.length,   href: 'dokumen.html' },
        ],
        categories: db.categories.map((c) => ({ ...c, count: count(c.code) })),
        latest: [...db.docs].sort(JDIH.byDateDesc).slice(0, 4),
      };
    }
  </script>
</body>
</html>
